<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Portfolio</title>
  <link rel="icon" href="/img/icon.png" type="image/x-icon">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navigation Bar -->
  <nav>
    <ul>
      <li><a href="#hero">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#skills">Skills</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <!-- Hero Section -->
  <section id="hero">
    <h1>Developer</h1>
    <div class="hero-image">
      <img src="/img/profile.png" alt="Portrait" />
    </div>
  </section>

  <!-- About Section -->
  <section id="about">
    <div class="about-content">
      <h2>About Me</h2>
      <p class="bio-section"></p>
    </div>
  </section>

  <!-- Projects Section -->
  <section id="projects">
    <div class="projects-header">
      <h2>Projects</h2>
      <p>Here are some of my recent projects.</p>
    </div>

    <!-- Carousel -->
    <div class="carousel-container">
      <div class="carousel-slider" id="carouselSlider">
        <!-- Projects will be inserted here by JavaScript -->
      </div>

      <!-- Navigation Buttons -->
      <button class="carousel-button prev" id="prevBtn" aria-label="Previous project">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
        </svg>
      </button>
      <button class="carousel-button next" id="nextBtn" aria-label="Next project">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
        </svg>
      </button>

      <!-- Indicators -->
      <div class="carousel-indicators" id="indicators">
        <!-- Indicators will be inserted here by JavaScript -->
      </div>
    </div>
  </section>

  <script src="js/main.js"></script>
  <script src="js/stardrop.js"></script>
</body>
</html>
